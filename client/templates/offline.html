<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline — UG Sports</title>
<style>
    :root {
        --pitch: #1f874b;
        --ochre: #d99a2b;
        --rust: #c0392b;
        --bg: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: #0f172a;
    }
    .offline-wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px 20px;
    }
    .crest {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        background: var(--pitch);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
        box-shadow: 0 8px 24px rgba(31, 135, 75, 0.25);
    }
    .crest img {
        width: 44px;
        height: 44px;
        object-fit: contain;
    }
    h1 {
        font-size: 1.4rem;
        font-weight: 800;
        margin-bottom: 8px;
        color: #0f172a;
    }
    p {
        font-size: 0.95rem;
        color: #64748b;
        max-width: 340px;
        line-height: 1.5;
        margin-bottom: 28px;
    }
    .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #fff;
        border: 1px solid #e2e8f0;
        padding: 8px 16px;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--rust);
        margin-bottom: 24px;
    }
    .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--rust);
    }
    .retry-btn {
        background: var(--pitch);
        color: #fff;
        border: none;
        padding: 12px 28px;
        border-radius: 8px;
        font-size: 0.9rem;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.15s ease;
    }
    .retry-btn:hover {
        background: #17703c;
    }
    .retry-btn:active {
        transform: translateY(1px);
    }
    .footnote {
        margin-top: 32px;
        font-size: 0.75rem;
        color: #94a3b8;
    }
</style>
</head>
<body>
<div class="offline-wrap">
    <div class="crest">
        <img src="/static/UG_LOGO.png" alt="UG Sports">
    </div>

    <div class="status-pill">
        <span class="status-dot"></span>
        No Connection
    </div>

    <h1>You're offline</h1>
    <p>
        This page hasn't been saved for offline use yet. Reconnect to the internet
        and try again — your saved pages will still work without a connection.
    </p>

    <button class="retry-btn" onclick="window.location.reload()">Try Again</button>

    <p class="footnote">Governor's Cup &middot; UG Sports</p>
</div>
</body>
</html>
